<main>

    <section>
        <h2>Hit me up!!!</h2>

        <p>
            If you want to contact me, you can use the form below.
            Feel free to leave a message.
        </p>

        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" placeholder="Enter subject">

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="6" placeholder="Write your message"></textarea>

            <button type="submit">Send Message</button>

        </form>
    </section>

    <section>
        <h2>My Contact</h2>

        <article class="contact-box">
            <p><strong>Name:</strong> Ian Clester</p>
            <p><strong>Location:</strong> Baguio City</p>
            <p>
                <strong>GitHub:</strong>
                <a href="https://github.com/ClesterIan" target="_blank">
                    github.com/ClesterIan
                </a>
            </p>
        </article>
    </section>
